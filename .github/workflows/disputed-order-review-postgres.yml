name: Disputed order review Postgres proof

on:
  pull_request:
    paths:
      - '.github/workflows/disputed-order-review-postgres.yml'
      - 'scripts/test-disputed-order-review-case-postgres.sh'
      - 'supabase/tests/disputed_order_review_case_*.sql'
      - 'supabase/migrations/20261113010000_disputed_order_review_case_ownership.sql'
      - 'supabase/migrations/rollback/20261113010000_disputed_order_review_case_ownership.rollback.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/disputed-order-review-postgres.yml'
      - 'scripts/test-disputed-order-review-case-postgres.sh'
      - 'supabase/tests/disputed_order_review_case_*.sql'
      - 'supabase/migrations/20261113010000_disputed_order_review_case_ownership.sql'
      - 'supabase/migrations/rollback/20261113010000_disputed_order_review_case_ownership.rollback.sql'

permissions:
  contents: read

concurrency:
  group: disputed-order-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker info
      - run: bash scripts/test-disputed-order-review-case-postgres.sh
